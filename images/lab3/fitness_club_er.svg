<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<rect width="1400" height="850" fill="#ffffff"/>
<style>
.title{font: bold 26px Arial,sans-serif;fill:#17365d}.head{font:bold 17px Arial,sans-serif;fill:#fff}.field{font:15px Arial,sans-serif;fill:#17212b}.rel{font:14px Arial,sans-serif;fill:#334155}.box{stroke-width:2;rx:10;ry:10}.line{stroke:#64748b;stroke-width:2;fill:none}
</style>
<text x="700" y="38" text-anchor="middle" class="title">Концептуальная модель данных фитнес-клуба</text>
<path class="line" d="M300 200 H365 V295 H410 M300 480 H350 V385 H410 M800 195 H845 V270 H890 M800 390 H845 V300 H890 M300 145 H600 V145 H890 M1050 355 V450"/>
<text x="330" y="185" class="rel">1:N</text><text x="330" y="465" class="rel">1:N</text><text x="820" y="180" class="rel">1:N</text><text x="820" y="375" class="rel">1:N</text><text x="1060" y="420" class="rel">1:0..1</text>
<g transform="translate(40 70)"><rect class="box" width="260" height="205" fill="#dae8fc" stroke="#6c8ebf"/><path d="M0 10 Q0 0 10 0 H250 Q260 0 260 10 V42 H0Z" fill="#3d6994"/><text x="14" y="27" class="head">Клиент (Client)</text><text x="14" y="68" class="field">PK client_id : число</text><text x="14" y="96" class="field">full_name : строка</text><text x="14" y="124" class="field">email : строка</text><text x="14" y="152" class="field">phone : строка</text><text x="14" y="180" class="field">registration_date : дата</text></g>
<g transform="translate(40 350)"><rect class="box" width="300" height="220" fill="#d5e8d4" stroke="#82b366"/><path d="M0 10 Q0 0 10 0 H290 Q300 0 300 10 V42 H0Z" fill="#387653"/><text x="14" y="27" class="head">Абонемент (Membership)</text><text x="14" y="68" class="field">PK membership_id : число</text><text x="14" y="96" class="field">FK client_id : число</text><text x="14" y="124" class="field">membership_type : строка</text><text x="14" y="152" class="field">start_date : дата</text><text x="14" y="180" class="field">end_date : дата</text><text x="14" y="208" class="field">status : справочное</text></g>
<g transform="translate(410 70)"><rect class="box" width="260" height="165" fill="#dae8fc" stroke="#6c8ebf"/><path d="M0 10 Q0 0 10 0 H250 Q260 0 260 10 V42 H0Z" fill="#3d6994"/><text x="14" y="27" class="head">Тренер (Trainer)</text><text x="14" y="68" class="field">PK trainer_id : число</text><text x="14" y="96" class="field">full_name : строка</text><text x="14" y="124" class="field">specialization : строка</text><text x="14" y="152" class="field">phone : строка</text></g>
<g transform="translate(410 300)"><rect class="box" width="390" height="220" fill="#d5e8d4" stroke="#82b366"/><path d="M0 10 Q0 0 10 0 H380 Q390 0 390 10 V42 H0Z" fill="#387653"/><text x="14" y="27" class="head">Занятие (TrainingSession)</text><text x="14" y="68" class="field">PK session_id : число</text><text x="14" y="96" class="field">FK trainer_id : число</text><text x="14" y="124" class="field">title : строка</text><text x="14" y="152" class="field">start_time : дата и время</text><text x="14" y="180" class="field">duration_minutes : число</text><text x="14" y="208" class="field">capacity : число</text></g>
<g transform="translate(890 170)"><rect class="box" width="360" height="200" fill="#fff2cc" stroke="#d6b656"/><path d="M0 10 Q0 0 10 0 H350 Q360 0 360 10 V42 H0Z" fill="#9a7417"/><text x="14" y="27" class="head">Запись на занятие (Booking)</text><text x="14" y="68" class="field">PK booking_id : число</text><text x="14" y="96" class="field">FK client_id : число</text><text x="14" y="124" class="field">FK session_id : число</text><text x="14" y="152" class="field">booking_date : дата и время</text><text x="14" y="180" class="field">status : справочное</text></g>
<g transform="translate(900 480)"><rect class="box" width="350" height="145" fill="#f8cecc" stroke="#b85450"/><path d="M0 10 Q0 0 10 0 H340 Q350 0 350 10 V42 H0Z" fill="#a74444"/><text x="14" y="27" class="head">Посещение (Attendance)</text><text x="14" y="68" class="field">PK attendance_id : число</text><text x="14" y="96" class="field">FK booking_id : уникальный</text><text x="14" y="124" class="field">attended : логическое</text></g>
<text x="40" y="680" class="rel">PK — первичный идентификатор; FK — ссылка на связанную сущность.</text>
<text x="40" y="710" class="rel">Связь Клиент—Занятие M:N реализована через сущность Booking.</text>
<text x="40" y="740" class="rel">Посещение создаётся не более одного раза для одной записи.</text>
</svg>